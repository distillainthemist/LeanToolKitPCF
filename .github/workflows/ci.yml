name: CI

# Type-checks the whole of shared/ + controls/ under the repo-root config.
#
# App CI (app-ci.yml) type-checks, tests and builds the code app, which covers
# the editor sources the app imports — but only those. This workflow is what
# catches a break in a card or shared module the registry doesn't currently
# mount, so the two are complementary, not duplicates.
#
# The PCF/canvas target was retired (docs/leanboard-pcf-retirement-plan.md),
# so there is no control-bundle build here any more.
on:
  push:
    branches: [main]
    paths:
      - "controls/**"
      - "shared/**"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "controls/**"
      - "shared/**"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

name: CI

# Guards the product on every push / PR: type checks over the shared design
# system + card editors, then the code app's tests and build.
#
# The PCF/canvas target was retired (docs/leanboard-pcf-retirement-plan.md),
# so there is no longer a control-bundle build here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            package-lock.json

      # root deps carry the typescript the shared/ + controls/ sources compile
      # against, and vite resolves the root tsconfig for the editor sources the
      # app imports
      - name: Install root dependencies
        run: npm ci

      - name: Typecheck shared + card editors
        run: npx tsc --noEmit -p tsconfig.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test app
        working-directory: app
        run: npm test

      # `npm run build` in app/ is `tsc && vite build` — covers the app typecheck
      - name: Build app
        working-directory: app
        run: npm run build

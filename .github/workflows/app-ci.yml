name: App CI

# Type-check, test, and build the code app whenever it (or the editor
# sources it consumes) changes. Node 22 is the pac code toolchain floor.
# ci.yml separately type-checks all of shared/ + controls/ at the repo root.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "controls/**"
      - "shared/**"
      - "tools/tile-defaults.json"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "controls/**"
      - "shared/**"
      - "tools/tile-defaults.json"
      - ".github/workflows/app-ci.yml"

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # no root install needed: the repo tsconfig became standalone when the
      # PCF target retired, so vite/vitest resolve the shared/ + controls/
      # editor sources from app/ alone (verified 2026-07-25)
      - run: npm ci
      - name: Type-check
        run: npx tsc -p tsconfig.json
      - name: Unit tests
        run: npx vitest run
      # Standard Documents guardrails (docs/leanboard-standard-documents-plan.md
      # Phase 0): the docs area must never share static imports with the
      # board path, and board-path chunks must stay under their ceilings.
      - name: Import gate
        run: node tools/import-gate.mjs
      - name: Build
        run: npm run build
      - name: Chunk sizes
        run: node tools/chunk-report.mjs

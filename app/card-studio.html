<!doctype html>
<!-- Card-studio plan, phase 1 verification. Opens the real studio over a
     stub slot, with persistence STUBBED, and asserts the contract that makes
     Cancel meaningful: nothing is written before Save, the left pane is
     editable only for cards that have standard content, actions are hidden
     everywhere, and a settings change re-renders the live preview.

       cd app && npm run dev  →  http://localhost:5180/card-studio.html

     Dev-server only: vite builds index.html alone. There is no Power Apps
     host here, so the roster/live-row reads fail and fall back — which is
     itself part of what this page checks. -->
<html>
<head>
  <meta charset="utf-8" />
  <title>Card studio audit</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #f0efea; }
    table { border-collapse: collapse; background: #fff; font-size: 13px; margin-bottom: 14px; }
    th, td { border: 1px solid #d5d1c8; padding: 5px 9px; text-align: left; }
    th { background: #2b2b2b; color: #fff; }
    .bad { color: #b32020; font-weight: 700; }
    .ok { color: #1e7a1e; font-weight: 600; }
    button.open { font: inherit; padding: 6px 12px; margin-right: 6px; }
  </style>
</head>
<body>
  <h2 style="margin:0 0 10px">Card studio audit</h2>
  <div id="summary">running…</div>
  <table id="report"><thead><tr><th>check</th><th>got</th><th>verdict</th></tr></thead><tbody></tbody></table>
  <div>
    <strong style="font-size:13px">Open one by hand:</strong><br />
    <div id="manual" style="margin-top:6px"></div>
  </div>

  <script type="module">
    // the app shell normally loads this from main.ts
    import "./src/style.css";
    import { openCardStudio } from "./src/screens/cardStudio.ts";
    import { CARDS, cardSpec } from "../controls/CardSettings/registry.ts";

    const tbody = document.querySelector("#report tbody");
    let bad = 0;
    const report = (check, got, ok) => {
      if (!ok) bad++;
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${check}</td><td>${got}</td><td class="${ok ? "ok" : "bad"}">${ok ? "ok" : "FAIL"}</td>`;
      tbody.appendChild(tr);
    };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const slotFor = (cardType, settings = {}) => ({
      pos: 1, w: 1, h: 1, nav: 0,
      cardId: `c-${cardType.toLowerCase()}`, cardType, title: "", settings,
    });
    const q = (sel) => document.querySelector(sel);
    /** Dismiss an open picker the way a user would (its promise resolves null). */
    const escapePicker = () =>
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));

    /** Open the studio, run `body`, then make sure it is closed. */
    async function withStudio(cardType, settings, body) {
      const calls = { persist: 0, archive: 0 };
      const done = openCardStudio({
        boardId: "b-test", standardDoc: "",
        slot: slotFor(cardType, settings),
        boards: [{ boardId: "b-other", name: "Other board", cards: [] }],
        persist: async () => { calls.persist++; },
        onArchive: async () => { calls.archive++; },
      });
      await wait(60); // panes paint synchronously now
      const result = await body(calls);
      if (q(".app-studio-overlay")) q(".app-studio-overlay").remove();
      return { result, calls, done };
    }

    // ---- 1. layout + the editable/preview split ----
    {
      const { result } = await withStudio("FiveWhys", {}, async () => ({
        label: q(".app-studio-panelabel-t")?.textContent,
        sub: q(".app-studio-panelabel-s")?.textContent,
        hasCard: !!q(".app-studio-card")?.firstElementChild,
        hasProps: !!q(".app-studio-props")?.firstElementChild,
        hasSaveCancel: [...document.querySelectorAll(".app-studio-foot .app-btn")]
          .map((b) => b.textContent).join(","),
      }));
      report("document card: left pane is editable standard content",
        `${result.label} — ${result.sub}`, result.label === "Standard content");
      report("both panes render", `card:${result.hasCard} props:${result.hasProps}`,
        result.hasCard && result.hasProps);
      report("footer has Cancel + Save", result.hasSaveCancel,
        result.hasSaveCancel === "Cancel,Save");
    }

    // ---- 2. preview-class cards are read-only and say why ----
    for (const type of ["KpiTrendCard", "ActionBoard", "LinkCard"]) {
      const { result } = await withStudio(type, {}, async () => ({
        label: q(".app-studio-panelabel-t")?.textContent,
        sub: q(".app-studio-panelabel-s")?.textContent,
      }));
      const note = cardSpec(type).standardContentNote;
      report(`${type}: preview pane with its reason`, result.sub?.slice(0, 46) + "…",
        result.label === "Preview" && result.sub === note);
    }

    // ---- 3. nothing is persisted before Save ----
    {
      const { calls, result } = await withStudio("FiveWhys", {}, async () => {
        // type into the properties pane (the card title field)
        const input = q(".app-studio-props input.ltk-input, .app-studio-props input");
        input.value = "Renamed by the audit";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        await wait(50);
        return {
          dot: getComputedStyle(q(".app-studio-dot")).visibility,
          headTitle: q(".app-studio-title")?.textContent,
        };
      });
      report("an edit marks dirty and retitles the header", `${result.dot} / ${result.headTitle}`,
        result.dot === "visible" && result.headTitle === "Renamed by the audit");
      report("nothing persisted before Save", `persist called ${calls.persist}×`, calls.persist === 0);
    }

    // ---- 4. Save persists exactly once ----
    {
      const calls = { persist: 0 };
      let saved = null;
      const slot = slotFor("FiveWhys");
      const done = openCardStudio({
        boardId: "b-test", standardDoc: "", slot,
        boards: [],
        persist: async (s) => { calls.persist++; saved = s; },
      });
      await wait(60);
      const input = q(".app-studio-props input");
      input.value = "Saved title";
      input.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(50);
      [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent === "Save").click();
      const outcome = await done;
      report("Save persists once, applies the draft, and closes",
        `${outcome} · persist ${calls.persist}× · title "${saved?.title}"`,
        outcome === "saved" && calls.persist === 1 && saved.title === "Saved title" &&
        !document.querySelector(".app-studio-overlay"));
    }

    // ---- 5. Cancel with no edits closes silently and writes nothing ----
    {
      const calls = { persist: 0 };
      const done = openCardStudio({
        boardId: "b-test", standardDoc: "", slot: slotFor("FiveWhys"), boards: [],
        persist: async () => { calls.persist++; },
      });
      await wait(60);
      [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent === "Cancel").click();
      const outcome = await done;
      report("clean Cancel closes with no prompt and no write",
        `${outcome} · persist ${calls.persist}×`,
        outcome === "cancelled" && calls.persist === 0);
    }

    // ---- 6. actions are hidden in every studio mount ----
    {
      const withActions = ["FiveWhys", "RiskMatrix", "AgendaCard"];
      const found = [];
      for (const type of withActions) {
        await withStudio(type, {}, async () => {
          const txt = q(".app-studio-card")?.textContent ?? "";
          if (/raise action|＋ Add an action|Actions \(/i.test(txt)) found.push(type);
        });
      }
      report("no action-raising affordance in the studio",
        found.length ? found.join(", ") : "none on " + withActions.join("/"),
        found.length === 0);
    }

    // ---- 7. a settings change re-renders the live preview ----
    {
      const { result } = await withStudio("SqdpcCard", {}, async () => {
        const before = q(".app-studio-card")?.textContent ?? "";
        // Dimensions is a chips field; drive the underlying draft through the
        // card-title input instead, which every card has and which the
        // preview reflects in its title bar
        const input = q(".app-studio-props input");
        input.value = "Preview follows settings";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        await wait(900); // > REMOUNT_QUIET_MS
        const after = q(".app-studio-card")?.textContent ?? "";
        return { changed: after !== before, has: after.includes("Preview follows settings") };
      });
      report("settings change re-renders the card pane",
        `changed:${result.changed} title-in-card:${result.has}`, result.has);
    }

    // ---- 8. phase 2: the tile has no ✎, and tapping it configures ----
    {
      const { BoardGridView } = await import("../controls/BoardGrid/editor.ts");
      const host = document.createElement("div");
      host.style.cssText = "position:fixed;left:-4000px;top:0;width:900px;height:600px";
      document.body.appendChild(host);
      const events = [];
      const grid = new BoardGridView(host, {
        onSelect: (e) => events.push(e),
        onLayout: () => {},
      });
      grid.setEditMode(true);
      grid.setTiles(
        [{ pos: 1, w: 1, h: 1, nav: 1, cardId: "c1", cardType: "FiveWhys", title: "Top issue", svg: "", barColor: "" }],
        3
      );
      await wait(50);
      const editBtns = host.querySelectorAll(".ltk-bg-editbtn").length;
      report("no ✎ button on the tile", `${editBtns} found`, editBtns === 0);

      const tile = host.querySelector(".ltk-bg-tile");
      const opts = { bubbles: true, clientX: 100, clientY: 100, button: 0, pointerType: "mouse", pointerId: 1 };
      tile.dispatchEvent(new PointerEvent("pointerdown", opts));
      document.dispatchEvent(new PointerEvent("pointerup", opts));
      await wait(50);
      report("tapping the tile fires configure",
        events.map((e) => e.action).join(",") || "(none)",
        events.some((e) => e.action === "configure" && e.cardId === "c1"));

      // the nav-order input must NOT be swallowed by the tap handler
      const nav = host.querySelector(".ltk-bg-nav");
      events.length = 0;
      nav.dispatchEvent(new PointerEvent("pointerdown", opts));
      document.dispatchEvent(new PointerEvent("pointerup", opts));
      await wait(50);
      report("the nav-order field still takes its own clicks",
        events.length ? events.map((e) => e.action).join(",") : "no configure fired",
        events.length === 0);

      grid.destroy();
      host.remove();
    }

    // ---- 9. phase 2: the add picker ----
    const ART = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#123456"/></svg>';
    const pickerOpts = (over = {}) => ({
      catalogSvg: { FiveWhys: ART },
      archived: [],
      copySources: [],
      onDeleteArchived: async () => {},
      ...over,
    });
    {
      const { openCardPicker } = await import("./src/screens/cardPicker.ts");
      const pick = openCardPicker(pickerOpts());
      await wait(80);
      const optCount = document.querySelectorAll(".app-picker-opt").length;
      const artCount = document.querySelectorAll(".app-picker-art svg").length;
      report("picker lists the visible catalogue with art",
        `${optCount} cards, ${artCount} with art`,
        optCount === CARDS.filter((c) => !c.hidden).length && artCount === 1);

      // search narrows it
      const search = document.querySelector(".app-picker-search");
      search.value = "pareto";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(30);
      const narrowed = document.querySelectorAll(".app-picker-opt").length;
      report("search narrows the picker", `${narrowed} match "pareto"`, narrowed === 1);

      document.querySelector(".app-picker-opt").click();
      const picked = await pick;
      report("picking resolves the chosen type", JSON.stringify(picked),
        picked?.kind === "new" && picked.cardType === "ParetoCard" &&
        !document.querySelector(".app-picker-overlay"));
    }

    // ---- 10. phase 3: archived + copy sources ----
    {
      const { openCardPicker } = await import("./src/screens/cardPicker.ts");
      const archSlot = {
        pos: 4, w: 1, h: 1, nav: 0, cardId: "old-pareto",
        cardType: "ParetoCard", title: "Retired pareto", settings: { config: { unit: "defects" } },
      };

      // (a) with nothing archived, the tab is not offered at all
      let pick = openCardPicker(pickerOpts());
      await wait(60);
      const tabsPlain = [...document.querySelectorAll(".app-picker-tab")].map((t) => t.textContent);
      escapePicker();
      await pick;
      report("no Archived tab when nothing is archived", tabsPlain.join(" | "),
        tabsPlain.length === 2 && !tabsPlain.some((t) => t.startsWith("Archived")));

      // (b) with an archived card, the tab appears with a count and restores
      pick = openCardPicker(pickerOpts({ archived: [{ slot: archSlot, svg: ART }] }));
      await wait(60);
      const tabs = [...document.querySelectorAll(".app-picker-tab")];
      const archTab = tabs.find((t) => t.textContent.startsWith("Archived"));
      report("Archived tab shows the count", archTab?.textContent ?? "(missing)",
        archTab?.textContent === "Archived (1)");
      archTab.click();
      await wait(40);
      const entryLabel = document.querySelector(".app-picker-opt-arch .app-picker-opt-label")?.textContent;
      document.querySelector(".app-picker-pickbtn").click();
      const restored = await pick;
      report("restoring returns the archived cardId",
        `${entryLabel} → ${JSON.stringify(restored)}`,
        entryLabel === "Retired pareto" && restored?.kind === "archived" &&
        restored.cardId === "old-pareto");

      // (c) permanent delete calls back and empties the tab
      const deleted = [];
      pick = openCardPicker(pickerOpts({
        archived: [{ slot: archSlot, svg: ART }],
        onDeleteArchived: async (id) => { deleted.push(id); },
      }));
      await wait(60);
      [...document.querySelectorAll(".app-picker-tab")].find((t) => t.textContent.startsWith("Archived")).click();
      await wait(40);
      const realConfirm = window.confirm;
      window.confirm = () => true;
      document.querySelector(".app-picker-del").click();
      await wait(60);
      window.confirm = realConfirm;
      const tabsAfter = [...document.querySelectorAll(".app-picker-tab")].map((t) => t.textContent);
      escapePicker();
      await pick;
      report("permanent delete removes it and drops the tab",
        `deleted ${JSON.stringify(deleted)} · tabs ${tabsAfter.join("|")}`,
        deleted.length === 1 && deleted[0] === "old-pareto" &&
        !tabsAfter.some((t) => t.startsWith("Archived")));

      // (d) copy: board picker + content toggle, returning a full reference
      pick = openCardPicker(pickerOpts({
        copySources: [
          { boardId: "b-this", name: "This board", cards: [
            { cardId: "risk-1", cardType: "RiskMatrix", title: "Site risks" },
          ] },
          { boardId: "b-other", name: "Other board", cards: [
            { cardId: "sq-1", cardType: "SqdpcCard", title: "Line SQDPC" },
          ] },
        ],
      }));
      await wait(60);
      [...document.querySelectorAll(".app-picker-tab")].find((t) => t.textContent === "Copy existing").click();
      await wait(40);
      const boardSel = document.querySelector(".app-picker-copybar select");
      const checked = document.querySelector(".app-picker-check input").checked;
      boardSel.value = "b-other";
      boardSel.dispatchEvent(new Event("change", { bubbles: true }));
      await wait(40);
      const cardLabels = [...document.querySelectorAll(".app-picker-opt-label")].map((l) => l.textContent);
      document.querySelector(".app-picker-opt").click();
      const copied = await pick;
      report("copy defaults to bringing the content", `checked:${checked}`, checked === true);
      report("copy returns the chosen board + card",
        `${cardLabels.join(",")} → ${JSON.stringify(copied)}`,
        copied?.kind === "copy" && copied.boardId === "b-other" &&
        copied.cardId === "sq-1" && copied.withContent === true);
    }

    // ---- 11. phase 3: a copied document is written even if untouched ----
    // A seeded save reaches the live-row WRITE, which needs the Power Apps
    // host — so offline it parks at "Saving…" and never resolves. What this
    // asserts is the part that is decidable here: the seed made Save treat
    // the document as pending, rather than skipping it as untouched.
    {
      const calls = { persist: 0 };
      const seeded = openCardStudio({
        boardId: "b-test", slot: slotFor("FiveWhys"), boards: [],
        standardDoc: '{"seeded":true}', seedDoc: true,
        persist: async () => { calls.persist++; },
      });
      await wait(60);
      // save WITHOUT touching anything: the copied content must still count
      [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent === "Save").click();
      await wait(200);
      const btn = [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent.startsWith("Sav"));
      report("a seeded (copied) document is written on an untouched Save",
        `persist ${calls.persist}× · then ${btn?.textContent ?? "closed"}`,
        calls.persist === 1 && btn?.textContent === "Saving…");
      q(".app-studio-overlay")?.remove();
      void seeded;

      // and the control: with no seed, an untouched Save writes no document
      // at all, so it closes immediately even with no host
      const plain = { persist: 0 };
      const done = openCardStudio({
        boardId: "b-test", slot: slotFor("FiveWhys"), boards: [], standardDoc: "",
        persist: async () => { plain.persist++; },
      });
      await wait(60);
      [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent === "Save").click();
      const outcome = await done;
      report("an untouched card writes no document (closes with no row write)",
        `${outcome} · persist ${plain.persist}×`,
        outcome === "saved" && plain.persist === 1);
    }

    // ---- 12. phase 4: modal focus handling ----
    {
      // an opener to return focus to when the dialog closes
      const opener = document.createElement("button");
      opener.textContent = "opener";
      document.body.appendChild(opener);
      opener.focus();

      const done = openCardStudio({
        boardId: "b-test", standardDoc: "", slot: slotFor("FiveWhys"), boards: [],
        persist: async () => {},
      });
      await wait(80);
      const panel = q(".app-studio-panel");
      report("the studio is marked as a modal dialog",
        `${panel?.getAttribute("role")} / aria-modal=${panel?.getAttribute("aria-modal")}`,
        panel?.getAttribute("role") === "dialog" && panel?.getAttribute("aria-modal") === "true");

      // Tab from the last focusable must wrap inside, not escape to the page
      const sel = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
      const items = [...panel.querySelectorAll(sel)].filter((e) => e.checkVisibility());
      items[items.length - 1].focus();
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", bubbles: true }));
      await wait(30);
      const wrapped = panel.contains(document.activeElement);
      report("Tab stays inside the dialog", wrapped ? "wrapped to the top" : "escaped", wrapped);

      [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent === "Cancel").click();
      await done;
      await wait(30);
      report("closing returns focus to the opener",
        document.activeElement === opener ? "opener" : (document.activeElement?.tagName ?? "?"),
        document.activeElement === opener);
      opener.remove();
    }

    // ---- 13. phase 4: duplicate from the studio header ----
    {
      // board mode offers it…
      let done = openCardStudio({
        boardId: "b-test", standardDoc: "", slot: slotFor("FiveWhys"), boards: [],
        canDuplicate: true, persist: async () => {},
      });
      await wait(60);
      const dup = [...document.querySelectorAll(".app-studio-headactions .app-btn")]
        .find((b) => b.textContent === "Duplicate");
      dup.click();
      const outcome = await done;
      report("Duplicate closes the studio asking for a copy", outcome, outcome === "duplicated");

      // …and adjusting a single meeting does not (archive/duplicate are
      // board-template concepts)
      done = openCardStudio({
        boardId: "b-test", slot: slotFor("FiveWhys"), boards: [],
        mode: "instance", instanceDoc: "", canDuplicate: true,
        onArchive: async () => {}, persist: async () => {},
      });
      await wait(60);
      const actions = [...document.querySelectorAll(".app-studio-headactions .app-btn")]
        .map((b) => b.textContent);
      [...document.querySelectorAll(".app-studio-foot .app-btn")]
        .find((b) => b.textContent === "Cancel").click();
      await done;
      report("instance mode offers neither Duplicate nor Archive",
        actions.length ? actions.join(",") : "(none)", actions.length === 0);
    }

    // ---- 14. properties pane: tabs, grouping, info icons ----
    {
      const { result: r1 } = await withStudio("EmbedCard", {}, async () => ({
        tabs: [...document.querySelectorAll(".ltk-cs-tab")].map((t) => t.textContent),
        onTab: q(".ltk-cs-tab-on")?.textContent,
        // the card's long description used to sit where a title belongs
        chosenBlock: !!q(".ltk-cs-chosen"),
        commonFields: [...q(".ltk-cs-tabbody").querySelectorAll(".ltk-cs-field-label")]
          .map((l) => l.textContent.replace("ⓘ", "").trim()).filter(Boolean),
        // the data policy moved in under Common
        subLabels: [...document.querySelectorAll(".ltk-cs-sublabel")].map((l) => l.textContent),
        headerType: q(".app-studio-type")?.textContent,
        inlineHelp: document.querySelectorAll(".ltk-cs-help").length,
        infoIcons: q(".ltk-cs-tabbody").querySelectorAll(".ltk-cs-info").length,
      }));
      report("properties are tabs, opening on Common",
        `${r1.tabs.join(" | ")} · on "${r1.onTab}"`,
        r1.tabs.length === 2 && r1.tabs[0] === "Common" &&
        r1.tabs[1] === "Card specific" && r1.onTab === "Common");
      report("the title strip sits in Common, right after the title",
        r1.commonFields.slice(0, 2).join(", "),
        r1.commonFields[0] === "Card title" && r1.commonFields[1] === "Title strip");
      report("New meeting instance moved under Common",
        r1.subLabels.join(", ") || "(none)",
        r1.subLabels.includes("New meeting instance"));
      report("explanations are info icons, not inline text",
        `${r1.infoIcons} icons, ${r1.inlineHelp} inline blocks`,
        r1.infoIcons > 0 && r1.inlineHelp === 0);
      report("the card description no longer heads the pane",
        r1.chosenBlock ? "still there" : "gone", !r1.chosenBlock);
      report("an untitled card does not repeat its type in the header",
        `type chip "${r1.headerType}"`, r1.headerType === "");

      // an info icon carries the registry's help text as its tooltip
      const { result: r2 } = await withStudio("EmbedCard", {}, async () => {
        [...document.querySelectorAll(".ltk-cs-tab")]
          .find((t) => t.textContent === "Card specific").click();
        await wait(40);
        const icons = [...document.querySelectorAll(".ltk-cs-tabbody .ltk-cs-info")];
        return {
          fields: [...document.querySelectorAll(".ltk-cs-tabbody .ltk-cs-field-label")]
            .map((l) => l.textContent.replace("ⓘ", "").trim()),
          tipAttr: icons[0]?.getAttribute("title"), // must be gone: no slow native tooltip
        };
      });
      report("switching tab shows that card's own settings",
        r2.fields.slice(0, 3).join(", "),
        r2.fields.includes("Embed URL"));
      report("info icons no longer rely on the browser's slow native tooltip",
        r2.tipAttr === null || r2.tipAttr === undefined ? "no title attribute" : `title="${r2.tipAttr}"`,
        !r2.tipAttr);

      // hovering shows a real tooltip, immediately, inside the viewport
      const { result: rTip } = await withStudio("SqdpcCard", {}, async () => {
        const icon = q(".app-studio-props .ltk-cs-info");
        icon.dispatchEvent(new MouseEvent("mouseenter"));
        await wait(40);
        const tip = q(".ltk-cs-tip");
        const tr = tip?.getBoundingClientRect();
        const out = {
          shown: !!tip,
          text: tip?.textContent?.slice(0, 30),
          inViewport: tr ? tr.top >= 0 && tr.left >= 0 &&
            tr.bottom <= window.innerHeight && tr.right <= window.innerWidth : false,
          // the studio overlay is z-index 10000; the tip must clear it
          z: tip ? Number(getComputedStyle(tip).zIndex) : 0,
          hit: Math.round(icon.getBoundingClientRect().width),
        };
        icon.dispatchEvent(new MouseEvent("mouseleave"));
        await wait(30);
        out.hidesOnLeave = !q(".ltk-cs-tip");
        return out;
      });
      report("hovering an info icon shows its explanation at once",
        `${rTip.shown ? `"${rTip.text}…"` : "nothing"} · z=${rTip.z} · ${rTip.hit}px target`,
        rTip.shown && rTip.inViewport && rTip.z > 10001 && rTip.hit >= 20);
      report("the tooltip clears when the pointer leaves",
        rTip.hidesOnLeave ? "gone" : "still showing", rTip.hidesOnLeave);

      // a linked card gets its Source tab
      const { result: r3 } = await withStudio("LinkCard", {}, async () => ({
        tabs: [...document.querySelectorAll(".ltk-cs-tab")].map((t) => t.textContent),
      }));
      report("a linked card gains a Source tab", r3.tabs.join(" | "),
        r3.tabs.includes("Source"));

      // the archive confirm names an untitled card by its type
      const { result: r4 } = await withStudio("EmbedCard", {}, async () => {
        const real = window.confirm;
        let msg = null;
        window.confirm = (m) => { msg = m; return false; };
        [...document.querySelectorAll(".app-studio-headactions .app-btn")]
          .find((b) => b.textContent === "Archive card").click();
        await wait(60);
        window.confirm = real;
        return msg?.split("\n")[0];
      });
      report("the archive prompt reads well for an untitled card", r4,
        r4 === "Archive this Embed card?");
    }

    document.getElementById("summary").innerHTML = bad === 0
      ? `<p class="ok">ALL PASS</p>` : `<p class="bad">${bad} FAILURES</p>`;

    // ---- manual openers ----
    const manual = document.getElementById("manual");
    for (const card of CARDS.filter((c) => !c.hidden)) {
      const b = document.createElement("button");
      b.className = "open";
      b.textContent = card.label;
      b.addEventListener("click", () => {
        openCardStudio({
          boardId: "b-test", standardDoc: "", slot: slotFor(card.type),
          boards: [{ boardId: "b-other", name: "Other board", cards: [
            { cardId: "x9", cardType: "RiskMatrix", title: "Site risks" },
          ] }],
          persist: async () => {},
          onArchive: async () => {},
        });
      });
      manual.appendChild(b);
    }
  </script>
</body>
</html>
